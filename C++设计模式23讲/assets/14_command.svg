<rect width="1400" height="535" rx="20" fill="#f4f7fa"/>
<text x="48" y="60" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="30" font-weight="700" fill="#20394e" text-anchor="start">14  命令 · Command</text>
<text x="48" y="102" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#61778a" text-anchor="start">职责示意图：看谁负责什么，再对照代码中的对象关系。</text>
<rect x="48" y="155" width="360" height="225" rx="14" fill="#fff" stroke="#c7d9e5" stroke-width="2"/>
<rect x="48" y="155" width="360" height="62" rx="14" fill="#e5edf7" stroke="#c7d9e5" stroke-width="2"/>
<text x="70" y="195" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#20394e" text-anchor="start">Remote 调用者</text>
<text x="70" y="263" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">保存命令历史</text>
<text x="70" y="298" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">负责执行与撤销入口</text>
<rect x="520" y="155" width="360" height="225" rx="14" fill="#fff" stroke="#c7d9e5" stroke-width="2"/>
<rect x="520" y="155" width="360" height="62" rx="14" fill="#e3f0ee" stroke="#c7d9e5" stroke-width="2"/>
<text x="542" y="195" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#20394e" text-anchor="start">Command 对象</text>
<text x="542" y="263" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">保存参数、接收者与旧值</text>
<text x="542" y="298" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">SetVolume 执行或恢复</text>
<rect x="992" y="155" width="360" height="225" rx="14" fill="#fff" stroke="#c7d9e5" stroke-width="2"/>
<rect x="992" y="155" width="360" height="62" rx="14" fill="#e9e9f4" stroke="#c7d9e5" stroke-width="2"/>
<text x="1014" y="195" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#20394e" text-anchor="start">Speaker 接收者</text>
<text x="1014" y="263" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">实际音量发生变化</text>
<text x="1014" y="298" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">生命期必须覆盖命令</text>
<path d="M418 255 L508 255" stroke="#63859d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="463.0" y="238.0" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#61778a" text-anchor="middle">调用命令</text>
<path d="M890 255 L980 255" stroke="#63859d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="935.0" y="238.0" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#61778a" text-anchor="middle">修改接收者</text>
<rect x="48" y="425" width="1304" height="72" rx="14" fill="#eaf1f6" stroke="#c7d9e5" stroke-width="2"/>
<text x="70" y="469" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#20394e" text-anchor="start">命令封装请求；撤销、异常安全与外部补偿必须显式实现。</text>
</svg>