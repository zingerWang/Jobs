<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1165" viewBox="0 0 1160 1165">
<defs><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 14 8 L 1 15 Z" fill="white" stroke="#42647a" stroke-width="2"/></marker><marker id="open" markerWidth="13" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 7 L 1 13" fill="none" stroke="#42647a" stroke-width="2"/></marker><marker id="diamond" markerWidth="24" markerHeight="16" refX="1" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 8 L 11 1 L 21 8 L 11 15 Z" fill="#42647a"/></marker></defs>
<rect width="1160" height="1165" fill="#f4f8fb"/>
<text x="65" y="48" font-size="27" font-weight="bold" fill="#264f69">14 命令 · UML 类图</text>
<text x="65" y="80" font-size="17" fill="#647d8c">关键成员摘录 · 连线编号对应下方说明 · 按代码实际持有关系绘制</text>
<rect x="65" y="110" width="740" height="128" rx="3" fill="white" stroke="#7291a5" stroke-width="2"/>
<path d="M65 152 H805 M65 184 H805" stroke="#9fb5c3" fill="none"/>
<text x="83" y="138" font-size="22" font-weight="bold" fill="#294d63">«interface» Command</text>
<text x="83" y="175" font-size="18" font-weight="normal" fill="#294d63">（无关键属性 / 已省略）</text>
<text x="83" y="207" font-size="18" font-weight="normal" fill="#294d63">+ execute()</text>
<text x="83" y="230" font-size="18" font-weight="normal" fill="#294d63">+ undo()</text>
<rect x="65" y="320" width="740" height="106" rx="3" fill="white" stroke="#7291a5" stroke-width="2"/>
<path d="M65 362 H805 M65 394 H805" stroke="#9fb5c3" fill="none"/>
<text x="83" y="348" font-size="22" font-weight="bold" fill="#294d63">Speaker</text>
<text x="83" y="385" font-size="18" font-weight="normal" fill="#294d63">+ volume</text>
<text x="83" y="417" font-size="18" font-weight="normal" fill="#294d63">（无关键操作 / 已省略）</text>
<rect x="65" y="530" width="740" height="196" rx="3" fill="white" stroke="#7291a5" stroke-width="2"/>
<path d="M65 572 H805 M65 672 H805" stroke="#9fb5c3" fill="none"/>
<text x="83" y="558" font-size="22" font-weight="bold" fill="#294d63">SetVolume</text>
<text x="83" y="595" font-size="18" font-weight="normal" fill="#294d63">- speaker_: Speaker&amp;</text>
<text x="83" y="618" font-size="18" font-weight="normal" fill="#294d63">- target_</text>
<text x="83" y="641" font-size="18" font-weight="normal" fill="#294d63">- previous_</text>
<text x="83" y="664" font-size="18" font-weight="normal" fill="#294d63">- executed_</text>
<text x="83" y="695" font-size="18" font-weight="normal" fill="#294d63">+ execute()</text>
<text x="83" y="718" font-size="18" font-weight="normal" fill="#294d63">+ undo()</text>
<rect x="65" y="740" width="740" height="128" rx="3" fill="white" stroke="#7291a5" stroke-width="2"/>
<path d="M65 782 H805 M65 814 H805" stroke="#9fb5c3" fill="none"/>
<text x="83" y="768" font-size="22" font-weight="bold" fill="#294d63">Remote</text>
<text x="83" y="805" font-size="18" font-weight="normal" fill="#294d63">- history_: vector&lt;unique_ptr&lt;Command&gt;&gt;</text>
<text x="83" y="837" font-size="18" font-weight="normal" fill="#294d63">+ run(command)</text>
<text x="83" y="860" font-size="18" font-weight="normal" fill="#294d63">+ undo()</text>
<path d="M805 542 H895 V164 H805" fill="none" stroke="#42647a" stroke-width="2" stroke-dasharray="9 6"  marker-end="url(#triangle)"/>
<text x="877" y="535" font-size="16" font-weight="bold" fill="#294d63">1</text>
<path d="M805 549 H950 V374 H805" fill="none" stroke="#42647a" stroke-width="2"   marker-end="url(#open)"/>
<text x="932" y="542" font-size="16" font-weight="bold" fill="#294d63">2</text>
<path d="M805 752 H1005 V182 H805" fill="none" stroke="#42647a" stroke-width="2"  marker-start="url(#diamond)" marker-end="url(#open)"/>
<text x="987" y="745" font-size="16" font-weight="bold" fill="#294d63">3</text>
<text x="65" y="955" font-size="22" font-weight="bold" fill="#294d63">关系说明（箭头指向基类、接口或被使用的对象）</text>
<text x="65" y="995" font-size="18" font-weight="normal" fill="#294d63">1. SetVolume → Command：实现接口</text>
<text x="65" y="1025" font-size="18" font-weight="normal" fill="#294d63">2. SetVolume → Speaker：关联 / 保存引用</text>
<text x="65" y="1055" font-size="18" font-weight="normal" fill="#294d63">3. Remote → Command：组合 / 生命周期拥有</text>
</svg>