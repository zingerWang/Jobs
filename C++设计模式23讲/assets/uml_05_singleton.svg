<text x="83" y="138" font-size="22" font-weight="bold" fill="#294d63">Metrics</text>
<text x="83" y="175" font-size="18" font-weight="normal" fill="#294d63">- count_: atomic&lt;int&gt;</text>
<text x="83" y="207" font-size="18" font-weight="normal" fill="#294d63">- Metrics()</text>
<text x="83" y="230" font-size="18" font-weight="normal" fill="#294d63">- ~Metrics()</text>
<text x="83" y="253" font-size="18" font-weight="normal" fill="#294d63">+ instance(): Metrics&amp; {static}</text>
<text x="83" y="276" font-size="18" font-weight="normal" fill="#294d63">+ record()</text>
<text x="83" y="299" font-size="18" font-weight="normal" fill="#294d63">+ count() const</text>
<text x="65" y="325" font-size="22" font-weight="bold" fill="#294d63">关系说明（箭头指向基类、接口或被使用的对象）</text>
<text x="65" y="365" font-size="18" font-weight="normal" fill="#294d63">此例只有一个关键类，实例唯一性由访问控制与静态方法约束。</text>
