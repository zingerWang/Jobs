<text x="48" y="102" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#61778a" text-anchor="start">职责示意图：看谁负责什么，再对照代码中的对象关系。</text>
