<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="535" viewBox="0 0 1400 535" role="img" aria-label="04  原型 · Prototype">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#63859d"/></marker></defs>
<rect width="1400" height="535" rx="20" fill="#f4f7fa"/>
<text x="48" y="60" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="30" font-weight="700" fill="#20394e" text-anchor="start">04  原型 · Prototype</text>
<text x="48" y="102" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#61778a" text-anchor="start">职责示意图：看谁负责什么，再对照代码中的对象关系。</text>
<rect x="48" y="155" width="360" height="225" rx="14" fill="#fff" stroke="#c7d9e5" stroke-width="2"/>
<rect x="48" y="155" width="360" height="62" rx="14" fill="#e5edf7" stroke="#c7d9e5" stroke-width="2"/>
<text x="70" y="195" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#20394e" text-anchor="start">Document 接口</text>
<text x="70" y="263" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">手里只有基类引用</text>
<text x="70" y="298" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">仍需要复制实际类型</text>
<rect x="520" y="155" width="360" height="225" rx="14" fill="#fff" stroke="#c7d9e5" stroke-width="2"/>
<rect x="520" y="155" width="360" height="62" rx="14" fill="#e3f0ee" stroke="#c7d9e5" stroke-width="2"/>
<text x="542" y="195" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#20394e" text-anchor="start">虚函数 clone</text>
<text x="542" y="263" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">进入实际派生类</text>
<text x="542" y="298" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">明确深拷贝或共享规则</text>
<rect x="992" y="155" width="360" height="225" rx="14" fill="#fff" stroke="#c7d9e5" stroke-width="2"/>
<rect x="992" y="155" width="360" height="62" rx="14" fill="#e9e9f4" stroke="#c7d9e5" stroke-width="2"/>
<text x="1014" y="195" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="700" fill="#20394e" text-anchor="start">独立副本</text>
<text x="1014" y="263" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">返回 unique_ptr&lt;Document&gt;</text>
<text x="1014" y="298" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="400" fill="#20394e" text-anchor="start">修改副本不影响原件</text>
<path d="M418 255 L508 255" stroke="#63859d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="463.0" y="238.0" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#61778a" text-anchor="middle">多态调用</text>
<path d="M890 255 L980 255" stroke="#63859d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="935.0" y="238.0" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#61778a" text-anchor="middle">复制自身</text>
<rect x="48" y="425" width="1304" height="72" rx="14" fill="#eaf1f6" stroke="#c7d9e5" stroke-width="2"/>
<text x="70" y="469" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="20" font-weight="400" fill="#20394e" text-anchor="start">复制 shared_ptr 只是共享原对象，不是克隆一个新对象。</text>
</svg>